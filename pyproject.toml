[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingtest-cli"
version = "0.1.0"
description = "Local-first API testing from OpenAPI specifications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LingTest Contributors" }]
keywords = ["testing", "openapi", "cli", "pytest", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
  "twine>=5,<7",
]

[project.scripts]
lingtest = "lingtest.cli:app"

[project.urls]
Homepage = "https://github.com/lingtest/lingtest-cli"
Repository = "https://github.com/lingtest/lingtest-cli"
Issues = "https://github.com/lingtest/lingtest-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lingtest"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

