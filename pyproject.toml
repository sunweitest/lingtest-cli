[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingtest-cli"
version = "0.4.0"
description = "AI testing agent for PRDs, OpenAPI specifications, and Vibe Coding workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "LingTest Contributors" }]
keywords = ["testing", "openapi", "cli", "pytest", "api", "ai", "vibe-coding"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27,<1",
  "openai==2.47.0",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
ai = []
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6",
  "twine>=5,<7",
]
tui = [
    "langchain>=1.3,<1.4",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "textual>=8.2.8",
]

[project.scripts]
lingtest = "lingtest.cli:app"

[project.urls]
Homepage = "https://github.com/sunweitest/lingtest-cli"
Repository = "https://github.com/sunweitest/lingtest-cli"
Issues = "https://github.com/sunweitest/lingtest-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lingtest"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
