name: git-install

# Guards the "install straight from a commit" path: every push must be
# installable without publishing a PyPI release.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install-base:
    # `pip install lingtest-cli` without extras must work: langgraph is optional,
    # so the CLI cannot import it eagerly. This job is the guard for that.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install without optional extras
        run: |
          uv venv .base-venv --python 3.12
          VIRTUAL_ENV=.base-venv uv pip install .

      - name: CLI works without extras and ships the skill
        run: |
          .base-venv/bin/lingtest --version
          .base-venv/bin/lingtest skill --print | grep -q "First principle"
          .base-venv/bin/lingtest skill --json
          .base-venv/bin/lingtest generate examples/openapi.yaml \
            --strategy deterministic -o /tmp/base-cases.json

      - name: Wheel contains the skill directory
        run: |
          uv build --wheel
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(n.endswith("_skills/lingtest-testing/SKILL.md") for n in names), names
          assert any(n.endswith("_skills/lingtest-testing/references/test-strategy.md") for n in names)
          print("skill files:", sum("_skills" in n for n in names))
          PY

  install-from-git:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install from this exact commit over git
        run: |
          uv venv --python ${{ matrix.python-version }} .git-install-venv
          VIRTUAL_ENV=.git-install-venv uv pip install \
            "lingtest-cli[tui] @ git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"

      - name: Smoke test the installed CLI
        run: |
          .git-install-venv/bin/lingtest --version
          .git-install-venv/bin/lingtest providers
          .git-install-venv/bin/python - <<'PY'
          import importlib.metadata as m
          direct = m.distribution("lingtest-cli").read_text("direct_url.json")
          assert "vcs_info" in direct and "commit_id" in direct, direct
          print("direct_url.json:", direct)
          PY

      - name: Generate and run cases from the installed package
        run: |
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.git-install-venv/bin/lingtest" generate \
            "$GITHUB_WORKSPACE/examples/openapi.yaml" --strategy deterministic -o cases.json
          "$GITHUB_WORKSPACE/.git-install-venv/bin/lingtest" run cases.json \
            --base-url http://127.0.0.1:9 -o report.json --timeout 2 || true
          test -s report.json

      - name: Build wheel from the same tree
        run: |
          uv build --wheel
          ls -l dist/
